# Genera la documentación con Doxygen y la publica en GitHub Pages.
# Requisito: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Documentación (Doxygen)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Genera la documentación y la sube como artefacto de Pages
  build:
    name: Generar documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Doxygen y Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generar documentación
        run: doxygen Doxyfile

      - name: Avisos de Doxygen
        run: cat docs/doxygen-warnings.log || true

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  # 2) Publica el artefacto en GitHub Pages
  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
